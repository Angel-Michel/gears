 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmisión COG Encriptada - ¡Feliz Cumpleaños Pafe!</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(to bottom, #0b1d3a 0%, #1a365d 40%, #5b8db8 70%, #a4d2e8 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Trebuchet MS', sans-serif;
            overflow-x: hidden;
            color: white;
        }

        .snowflakes {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .snowflake {
            position: absolute;
            width: 8px; height: 8px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-100px) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(100vh) translateX(50px); opacity: 0.5; }
        }

        h1 {
            z-index: 1;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #4fc3f7, 0 0 20px #0288d1;
            margin-bottom: 10px;
            margin-top: 20px;
            text-align: center;
            background: -webkit-linear-gradient(#fff, #90caf9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding: 0 15px;
        }

        .instruction-text {
            z-index: 1;
            color: #00e5ff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            margin-bottom: 25px;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.5);
            animation: pulseText 2s infinite;
            text-align: center;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .cards-container {
            display: flex;
            gap: 20px;
            z-index: 1;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 900px;
            padding: 0 15px;
            box-sizing: border-box;
            transition: all 0.4s ease;
        }

        /* Ahora las tarjetas son botones interactivos */
        .card {
            background: linear-gradient(145deg, #2a2d34, #1b1d22);
            border: 2px solid #4a4e59;
            border-radius: 15px;
            padding: 12px;
            width: 180px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6), inset 0 0 15px rgba(0,0,0,0.8);
            position: relative;
            transition: transform 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #00e5ff;
            box-shadow: 0 15px 25px rgba(0, 229, 255, 0.2), inset 0 0 15px rgba(0, 229, 255, 0.2);
        }

        .card::before, .card::after {
            content: '';
            position: absolute;
            width: 25px;
            height: 4px;
            border-radius: 2px;
            top: -3px;
        }
        .card::before { left: 20px; background: #00e5ff; box-shadow: 0 0 10px #00e5ff; }
        .card::after { right: 20px; background: #00e5ff; box-shadow: 0 0 10px #00e5ff; }
        
        .card.rojo::after { background: #ff1744; box-shadow: 0 0 10px #ff1744; }
        .card.verde::after { background: #00e676; box-shadow: 0 0 10px #00e676; }

        .character-img {
            width: 100%;
            height: 140px;
            background: #111;
            border-radius: 8px;
            border: 2px solid #555;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .character-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card:hover .character-img img {
            transform: scale(1.1);
        }

        .card h2 {
            font-size: 1rem;
            color: #e0e0e0;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Panel Holográfico */
        #message-panel {
            display: none;
            z-index: 2;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 10, 15, 0.95);
            border: 2px solid #00e5ff;
            border-radius: 10px;
            padding: 30px;
            width: 85%;
            max-width: 600px;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.4), inset 0 0 20px rgba(0, 229, 255, 0.2);
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 229, 255, 0.05) 2px, rgba(0, 229, 255, 0.05) 4px);
        }

        .hologram-open {
            animation: expandHolo 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes expandHolo {
            0% { height: 2px; width: 0%; opacity: 0; }
            40% { height: 2px; width: 85%; opacity: 1; }
            100% { height: auto; width: 85%; opacity: 1; }
        }

        .terminal-text {
            color: #00e5ff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.15rem;
            line-height: 1.5;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
            margin-bottom: 20px;
            min-height: 200px;
        }

        .typing-cursor {
            display: inline-block;
            width: 12px;
            height: 22px;
            background-color: #00e5ff;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* Botón de Cerrar Conexión */
        .close-btn {
            background: transparent;
            border: 1px solid #ff1744;
            color: #ff1744;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            padding: 8px 15px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            display: block;
            margin: 0 auto;
            text-shadow: 0 0 5px rgba(255, 23, 68, 0.5);
            box-shadow: inset 0 0 5px rgba(255, 23, 68, 0.3);
        }

        .close-btn:hover {
            background: rgba(255, 23, 68, 0.2);
            box-shadow: 0 0 15px rgba(255, 23, 68, 0.5), inset 0 0 10px rgba(255, 23, 68, 0.5);
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.6rem; }
            .instruction-text { font-size: 0.9rem; }
            .cards-container { gap: 15px; }
            .card { width: 42%; padding: 8px; }
            .character-img { height: 110px; }
            .card h2 { font-size: 0.8rem; }
            #message-panel { padding: 20px; width: 90%; }
            .terminal-text { font-size: 1rem; min-height: 250px;}
        }
    </style>
</head>
<body>

    <div class="snowflakes">
        <script>
            for(let i=0; i<40; i++){
                let snow = document.createElement('div');
                snow.className = 'snowflake';
                snow.style.left = Math.random() * 100 + 'vw';
                snow.style.animationDuration = (Math.random() * 3 + 2) + 's';
                snow.style.animationDelay = (Math.random() * 2) + 's';
                document.querySelector('.snowflakes').appendChild(snow);
            }
        </script>
    </div>

    <h1>Transmisión COG Encriptada</h1>
    <div class="instruction-text" id="instruction">> SELECCIONA UN SOLDADO PARA LEER SU REPORTE_</div>

    <div class="cards-container" id="main-ui">
        
        <!-- Tarjeta Anthony -->
        <div class="card" onclick="openTransmission('anthony')">
            <div class="character-img">
                <img src="anthony.jpg" alt="Anthony Carmine" onerror="this.src='https://via.placeholder.com/180x140/111/00e5ff?text=ANTHONY'">
            </div>
            <h2>Anthony</h2>
        </div>

        <!-- Tarjeta Benjamin -->
        <div class="card rojo" onclick="openTransmission('benjamin')">
            <div class="character-img">
                <img src="ben.jfif" alt="Benjamin Carmine">
            </div>
            <h2>Benjamin</h2>
        </div>

        <!-- Tarjeta Clayton -->
        <div class="card verde" onclick="openTransmission('clayton')">
            <div class="character-img">
                <img src="clayton.jpg" alt="Clayton Carmine" onerror="this.src='https://via.placeholder.com/180x140/111/00e676?text=CLAYTON'">
            </div>
            <h2>Clayton</h2>
        </div>

        <!-- Tarjeta Lizzie -->
        <div class="card" onclick="openTransmission('lizzie')">
            <div class="character-img">
                <img src="lizzi.jfif" alt="Lizzie Carmine">
            </div>
            <h2>Lizzie</h2>
        </div>

    </div>

    <div id="message-panel">
        <div class="terminal-text" id="terminal"></div>
        <button class="close-btn" onclick="closeTransmission()">[ X ] CERRAR CONEXIÓN</button>
    </div>

    <script>
        // Mensajes personalizados para cada personaje
        const messages = {
            anthony: "> Descifrando archivo A-01...\n> Remitente: Anthony Carmine\n\n¡Atención, soldado Pafe! ¡Feliz cumpleaños! 🎉\n\nQuería ser el primero en felicitarte. Tengo mi Lancer limpio y listo para el festejo en la pista de hielo.\n\n¡Eres increíble! Asegúrate de cubrirte bien y disfrutar tu día al máximo.",
            
            benjamin: "> Descifrando archivo B-02...\n> Remitente: Benjamin Carmine\n\n¡H-hola Pafe! Feliz cumpleaños... 🎂\n\nEspero que te guste la pista de hielo, aseguramos el perímetro solo para ti. Siempre te he admirado mucho, eres una verdadera leyenda para los novatos como yo. \n\n¡Pásala súper bien!",
            
            clayton: "> Descifrando archivo C-03...\n> Remitente: Clayton Carmine\n\n¡Feliz cumpleaños, Pafe! 🥓\n\nAquí el 'Mata-Grubs'. En esta escuadra solo los mejores sobreviven, y tú eres de la élite absoluta.\n\nQue hoy tengas un día lleno de tocino, recompensas épicas y cero Locust a la vista. ¡A celebrar con fuerza!",
            
            lizzie: "> Descifrando archivo L-04...\n> Remitente: Lizzie Carmine\n\n¡Qué onda, Pafe! ¡Feliz cumpleaños! ⚙️\n\nEstacioné el Minotauro cerca para venir a festejar contigo. Sin duda eres la persona más ruda y genial de toda la CGO.\n\n¡A disfrutar tu día, sigue brillando y pateando traseros!"
        };
        
        let typingTimer;
        let charIndex = 0;
        let currentMessage = "";
        
        function openTransmission(character) {
            // Limpiar variables por si se abre otro
            clearTimeout(typingTimer);
            document.getElementById("terminal").innerHTML = "";
            charIndex = 0;
            currentMessage = messages[character];
            
            // Ocultar Interfaz Principal
            document.getElementById('main-ui').style.filter = "blur(8px)";
            document.getElementById('main-ui').style.opacity = "0.2";
            document.getElementById('main-ui').style.pointerEvents = "none"; // Desactivar clics
            document.getElementById('instruction').style.opacity = "0";
            
            // Mostrar Panel
            const panel = document.getElementById('message-panel');
            panel.style.display = "block";
            panel.classList.remove("hologram-open"); 
            void panel.offsetWidth; // Reiniciar animación
            panel.classList.add("hologram-open");
            
            // Iniciar escritura holográfica
            setTimeout(typeWriter, 600);
        }

        function typeWriter() {
            if (charIndex < currentMessage.length) {
                let char = currentMessage.charAt(charIndex);
                if(char === '\n') {
                    document.getElementById("terminal").innerHTML += "<br>";
                } else {
                    document.getElementById("terminal").innerHTML += char;
                }
                charIndex++;
                let typingSpeed = Math.random() * (50 - 15) + 15; 
                typingTimer = setTimeout(typeWriter, typingSpeed); 
            } else {
                document.getElementById("terminal").innerHTML += '<span class="typing-cursor"></span>';
            }
        }

        function closeTransmission() {
            // Detener animación de escritura
            clearTimeout(typingTimer);
            
            // Ocultar Panel
            document.getElementById('message-panel').style.display = "none";
            
            // Restaurar Interfaz Principal
            document.getElementById('main-ui').style.filter = "none";
            document.getElementById('main-ui').style.opacity = "1";
            document.getElementById('main-ui').style.pointerEvents = "auto";
            document.getElementById('instruction').style.opacity = "1";
        }
    </script>
</body>
</html>
