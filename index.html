<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmisión COG Encriptada - ¡Feliz Cumpleaños Pafe!</title>
    <!-- Importar fuente estilo militar/tecnológico -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* Fondo de Pista de Hielo y Cielo de Invierno */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(to bottom, #0b1d3a 0%, #1a365d 40%, #5b8db8 70%, #a4d2e8 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            overflow-x: hidden;
            color: white;
        }

        /* Efecto de nieve cayendo */
        .snowflakes {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .snowflake {
            position: absolute;
            width: 8px; height: 8px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-100px) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(100vh) translateX(50px); opacity: 0.5; }
        }

        /* Título Principal */
        h1 {
            z-index: 1;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #4fc3f7, 0 0 20px #0288d1;
            margin-bottom: 30px;
            margin-top: 20px;
            text-align: center;
            background: -webkit-linear-gradient(#fff, #90caf9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding: 0 15px;
        }

        /* Contenedor de las tarjetas */
        .cards-container {
            display: flex;
            gap: 25px;
            z-index: 1;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
        }

        /* Tarjetas Metálicas Estilo Gears */
        .card {
            background: linear-gradient(145deg, #2a2d34, #1b1d22);
            border: 2px solid #4a4e59;
            border-radius: 15px;
            padding: 12px;
            width: 220px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6), inset 0 0 15px rgba(0,0,0,0.8);
            position: relative;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Luces de los bordes de la armadura */
        .card::before, .card::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 4px;
            border-radius: 2px;
            top: -3px;
        }
        .card.lizzie::before { left: 20px; background: #00e5ff; box-shadow: 0 0 10px #00e5ff; }
        .card.lizzie::after { right: 20px; background: #00e5ff; box-shadow: 0 0 10px #00e5ff; }
        
        .card.benjamin::before { left: 20px; background: #00e5ff; box-shadow: 0 0 10px #00e5ff; }
        .card.benjamin::after { right: 20px; background: #ff1744; box-shadow: 0 0 10px #ff1744; }

        /* Contenedor de las fotos */
        .character-img {
            width: 100%;
            height: 160px;
            background: #111;
            border-radius: 8px;
            border: 2px solid #555;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .character-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card:hover .character-img img {
            transform: scale(1.05);
        }

        .card h2 {
            font-size: 1.1rem;
            color: #e0e0e0;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Botón de Acción */
        .action-btn {
            z-index: 1;
            background: linear-gradient(to bottom, #d32f2f, #b71c1c);
            border: 2px solid #ff5252;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(211, 47, 47, 0.5);
            transition: all 0.2s ease;
            margin-bottom: 30px;
        }

        .action-btn:hover {
            background: linear-gradient(to bottom, #f44336, #d32f2f);
            box-shadow: 0 8px 25px rgba(255, 82, 82, 0.7);
            transform: scale(1.05);
        }

        /* Panel de Mensaje Oculto (Holograma) */
        #message-panel {
            display: none;
            z-index: 2;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 10, 15, 0.95);
            border: 2px solid #00e5ff;
            border-radius: 10px;
            padding: 30px;
            width: 85%;
            max-width: 600px;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.4), inset 0 0 20px rgba(0, 229, 255, 0.2);
            text-align: left;
            /* Efecto Scanlines de monitor viejo */
            background-image: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 229, 255, 0.05) 2px,
                rgba(0, 229, 255, 0.05) 4px
            );
        }

        /* Animación de apertura holográfica */
        .hologram-open {
            animation: expandHolo 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes expandHolo {
            0% { height: 2px; width: 0%; opacity: 0; }
            40% { height: 2px; width: 85%; opacity: 1; }
            100% { height: auto; width: 85%; opacity: 1; }
        }

        .terminal-text {
            color: #00e5ff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            line-height: 1.5;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
        }

        .typing-cursor {
            display: inline-block;
            width: 12px;
            height: 22px;
            background-color: #00e5ff;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* Media Queries para Celulares */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
                margin-bottom: 20px;
            }
            .cards-container {
                gap: 15px;
            }
            .card {
                width: 42%; /* Para que quepan dos tarjetas lado a lado en vertical */
                padding: 8px;
            }
            .character-img {
                height: 120px; /* Imágenes más cortas en móvil */
            }
            .card h2 {
                font-size: 0.85rem;
            }
            .action-btn {
                padding: 12px 20px;
                font-size: 1rem;
                width: 85%; /* Botón más ancho y fácil de tocar en móvil */
            }
            #message-panel {
                padding: 20px;
                width: 90%;
            }
            .terminal-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="snowflakes">
        <script>
            for(let i=0; i<40; i++){
                let snow = document.createElement('div');
                snow.className = 'snowflake';
                snow.style.left = Math.random() * 100 + 'vw';
                snow.style.animationDuration = (Math.random() * 3 + 2) + 's';
                snow.style.animationDelay = (Math.random() * 2) + 's';
                document.querySelector('.snowflakes').appendChild(snow);
            }
        </script>
    </div>

    <h1>Transmisión COG Encriptada</h1>

    <div class="cards-container" id="main-ui">
        <div class="card lizzie">
            <div class="character-img">
                <img src="lizzi.jfif" alt="Lizzie Carmine">
            </div>
            <h2>Lizzie Carmine</h2>
        </div>

        <div class="card benjamin">
            <div class="character-img">
                <img src="ben.jfif" alt="Benjamin Carmine">
            </div>
            <h2>Benjamin Carmine</h2>
        </div>
    </div>

    <button class="action-btn" id="decrypt-btn" onclick="startDecryption()">Descifrar Mensaje</button>

    <div id="message-panel">
        <div class="terminal-text" id="terminal"></div>
    </div>

    <script>
        const secretMessage = "> Iniciando desencriptación...\n> Conexión segura CGO establecida.\n\n¡FELIZ CUMPLEAÑOS, PAFE! 🎉\n\nLizzie y Benjamin han asegurado el perímetro en la pista de hielo exclusivamente para celebrar tu día.\n\nEres una verdadera leyenda en nuestra escuadra. Que este nuevo nivel en tu vida esté lleno de victorias, recompensas épicas y cero Locust a la vista.\n\n¡Disfruta tu día al máximo, soldado! Sigue brillando.\n\n> Fin de la transmisión.";
        
        let i = 0;
        
        function startDecryption() {
            document.getElementById('main-ui').style.filter = "blur(8px)";
            document.getElementById('main-ui').style.opacity = "0.3";
            document.getElementById('decrypt-btn').style.display = "none";
            
            const panel = document.getElementById('message-panel');
            panel.style.display = "block";
            // Activar animación holográfica
            panel.classList.add("hologram-open");
            
            // Retrasar la escritura para que la animación holográfica termine primero
            setTimeout(typeWriter, 600);
        }

        function typeWriter() {
            if (i < secretMessage.length) {
                let char = secretMessage.charAt(i);
                if(char === '\n') {
                    document.getElementById("terminal").innerHTML += "<br>";
                } else {
                    document.getElementById("terminal").innerHTML += char;
                }
                i++;
                // Pequeña variación de tiempo para simular escritura real
                let typingSpeed = Math.random() * (60 - 20) + 20; 
                setTimeout(typeWriter, typingSpeed); 
            } else {
                document.getElementById("terminal").innerHTML += '<span class="typing-cursor"></span>';
            }
        }
    </script>
</body>
</html>
