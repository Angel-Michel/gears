 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmisión COG - ¡Feliz Cumpleaños Pafe!</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: url('fondo.jfif');
            background-size: cover;
            background-position: center bottom;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-family: 'Trebuchet MS', sans-serif;
            overflow-x: hidden;
            color: white;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 29, 58, 0.45);
            z-index: 0;
            pointer-events: none;
        }

        .snowflakes {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .snowflake {
            position: absolute;
            width: 6px; height: 6px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-100px) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(100vh) translateX(30px); opacity: 0.3; }
        }

        .header-container {
            z-index: 2;
            width: 100%;
            text-align: center;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 15px #4fc3f7, 0 0 30px #0288d1, 2px 2px 5px rgba(0,0,0,0.8);
            margin: 0 0 8px 0;
            background: -webkit-linear-gradient(#e0f7fa, #4fc3f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding: 0 15px;
        }

        .instruction-text {
            color: #81d4fa;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.8), 1px 1px 2px black;
            animation: pulseText 2s infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
            width: 100%;
            max-width: 900px;
            padding: 0 15px;
            box-sizing: border-box;
            margin-bottom: 30px;
        }

        .characters-grid {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            margin-bottom: 20px;
        }

        .character-card {
            background: linear-gradient(145deg, #1f232a, #111317);
            border: 2px solid #4a4e59;
            border-radius: 12px;
            padding: 10px;
            width: 150px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7), inset 0 0 15px rgba(0,0,0,0.9);
            position: relative;
            transition: all 0.3s ease;
        }

        .character-card:hover {
            transform: translateY(-8px);
            border-color: #00e5ff;
            box-shadow: 0 15px 30px rgba(0, 229, 255, 0.3), inset 0 0 20px rgba(0, 229, 255, 0.3);
        }

        .character-card::before, .character-card::after {
            content: '';
            position: absolute;
            width: 25px;
            height: 4px;
            border-radius: 2px;
            top: -3px;
        }
        .character-card::before { left: 15px; background: #00e5ff; box-shadow: 0 0 8px #00e5ff; }
        .character-card::after { right: 15px; background: #00e5ff; box-shadow: 0 0 8px #00e5ff; }

        .character-img-container {
            width: 100%;
            height: 150px;
            background: #090b0e;
            border-radius: 8px;
            border: 1px solid #333;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .character-card img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            transition: transform 0.3s ease;
        }

        .character-card:hover img {
            transform: scale(1.08);
        }

        .character-name {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.95rem;
            color: #e0e0e0;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px black;
            margin: 0;
        }

        /* Botón de Transmisión Conjunta */
        .group-btn {
            background: linear-gradient(145deg, #0288d1, #01579b);
            border: 2px solid #4fc3f7;
            color: white;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.05rem;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 5px 20px rgba(2, 136, 209, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.8);
            margin-top: 5px;
        }

        .group-btn:hover {
            background: linear-gradient(145deg, #039be5, #0288d1);
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(0, 229, 255, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.5);
            border-color: #fff;
        }

        /* Panel Holográfico */
        #message-panel {
            display: none;
            z-index: 10;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 10, 15, 0.95);
            border: 2px solid #00e5ff;
            border-radius: 8px;
            padding: 25px;
            width: 85%;
            max-width: 600px;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.5), inset 0 0 20px rgba(0, 229, 255, 0.2);
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 229, 255, 0.05) 2px, rgba(0, 229, 255, 0.05) 4px);
        }

        .hologram-open {
            animation: expandHolo 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes expandHolo {
            0% { height: 2px; width: 0%; opacity: 0; }
            40% { height: 2px; width: 85%; opacity: 1; }
            100% { height: auto; width: 85%; opacity: 1; }
        }

        .terminal-text {
            color: #00e5ff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.12rem;
            line-height: 1.5;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
            margin-bottom: 20px;
            min-height: 200px;
        }

        .typing-cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background-color: #00e5ff;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink { 50% { opacity: 0; } }

        .close-btn {
            background: transparent;
            border: 1px solid #ff1744;
            color: #ff1744;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            padding: 8px 15px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            display: block;
            margin: 0 auto;
            text-shadow: 0 0 5px rgba(255, 23, 68, 0.5);
            box-shadow: inset 0 0 5px rgba(255, 23, 68, 0.3);
        }

        .close-btn:hover {
            background: rgba(255, 23, 68, 0.1);
            box-shadow: 0 0 15px rgba(255, 23, 68, 0.6), inset 0 0 10px rgba(255, 23, 68, 0.5);
            color: white;
            border-color: white;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.4rem; }
            .instruction-text { font-size: 0.8rem; }
            .characters-grid { gap: 10px; }
            .character-card { width: 44%; padding: 6px; }
            .character-img-container { height: 115px; }
            .character-name { font-size: 0.85rem; }
            .group-btn { font-size: 0.9rem; padding: 10px 15px; }
            #message-panel { padding: 15px; width: 90%; }
            .terminal-text { font-size: 0.95rem; min-height: 220px;}
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="snowflakes">
        <script>
            for(let i=0; i<40; i++){
                let snow = document.createElement('div');
                snow.className = 'snowflake';
                snow.style.left = Math.random() * 100 + 'vw';
                snow.style.animationDuration = (Math.random() * 3 + 2) + 's';
                snow.style.animationDelay = (Math.random() * 2) + 's';
                document.querySelector('.snowflakes').appendChild(snow);
            }
        </script>
    </div>

    <div class="header-container" id="main-header">
        <h1>Transmisión COG Encriptada</h1>
        <div class="instruction-text">> SELECCIONA UN SOLDADO O LA ESCUADRA_</div>
    </div>

    <div class="main-container" id="main-ui">
        <div class="characters-grid">
            <div class="character-card" onclick="openTransmission('anthony')">
                <div class="character-img-container">
                    <img src="anto.png" alt="Anthony">
                </div>
                <p class="character-name">ANTHONY</p>
            </div>

            <div class="character-card" onclick="openTransmission('benjamin')">
                <div class="character-img-container">
                    <img src="ben.png" alt="Benjamin">
                </div>
                <p class="character-name">BENJAMIN</p>
            </div>

            <div class="character-card" onclick="openTransmission('clayton')">
                <div class="character-img-container">
                    <img src="clay.png" alt="Clayton">
                </div>
                <p class="character-name">CLAYTON</p>
            </div>

            <div class="character-card" onclick="openTransmission('lizzie')">
                <div class="character-img-container">
                    <img src="lizzi.png" alt="Lizzie">
                </div>
                <p class="character-name">LIZZIE</p>
            </div>
        </div>

        <!-- Botón de Transmisión Conjunta -->
        <button class="group-btn" onclick="openTransmission('escua')">[ 📡 MENSAJE DE LA ESCUADRA CARMINE ]</button>
    </div>

    <div id="message-panel">
        <div class="terminal-text" id="terminal"></div>
        <button class="close-btn" onclick="closeTransmission()">[ X ] CERRAR CONEXIÓN</button>
    </div>

    <script>
        const messages = {
            anthony: "> Descifrando archivo A-01...\n> Remitente: Anthony Carmine\n\n¡Atención, soldado Pafe! ¡Feliz cumpleaños! 🎉\n\nQuería ser el primero en felicitarte. Tengo mi Lancer limpio y listo para el festejo en la base.\n\n¡Eres increíble! Asegúrate de cubrirte bien y disfrutar tu día al máximo.",
            
            benjamin: "> Descifrando archivo B-02...\n> Remitente: Benjamin Carmine\n\n¡H-hola Pafe! Feliz cumpleaños... 🎂\n\nEspero que te guste la nieve, aseguramos el perímetro solo para ti. Siempre te he admirado mucho, eres una verdadera leyenda para los novatos como yo. \n\n¡Pásala súper bien!",
            
            clayton: "> Descifrando archivo C-03...\n> Remitente: Clayton Carmine\n\n¡Feliz cumpleaños, Pafe! 🥓\n\nAquí el 'Mata-Grubs'. En esta escuadra solo los mejores sobreviven, y tú eres de la élite absoluta.\n\nQue hoy tengas un día lleno de tocino, recompensas épicas y cero Locust a la vista. ¡A celebrar con fuerza!",
            
            lizzie: "> Descifrando archivo L-04...\n> Remitente: Lizzie Carmine\n\n¡Qué onda, Pafe! ¡Feliz cumpleaños! ⚙️\n\nEstacioné el Minotauro cerca para venir a festejar contigo. Sin duda eres la persona más ruda y genial de toda la CGO.\n\n¡A disfrutar tu día, sigue brillando y pateando traseros!",
            
            escua: "> Transmisión General CGO - Canal Prioritario Alpha\n> Remitentes: Escuadrón Carmine (Anthony, Ben, Clayton y Lizzie)\n\n¡Feliz cumpleaños, Pafe! 🎂🎉⚙️\n\nDe parte de toda la familia Carmine y de toda la escuadra: gracias por ser el corazón de nuestras misiones y la leyenda más grande de este pelotón.\n\nHoy no hay Locust que arruinen el festejo. ¡Que te pases un día épico, lleno de victorias y grandes momentos! ¡A celebrar con todo, soldado!"
        };
        
        let typingTimer;
        let charIndex = 0;
        let currentMessage = "";
        
        function openTransmission(character) {
            clearTimeout(typingTimer);
            document.getElementById("terminal").innerHTML = "";
            charIndex = 0;
            currentMessage = messages[character];
            
            document.getElementById('main-ui').style.filter = "blur(8px) brightness(0.4)";
            document.getElementById('main-ui').style.pointerEvents = "none"; 
            document.getElementById('main-header').style.filter = "blur(5px) brightness(0.5)";
            
            const panel = document.getElementById('message-panel');
            panel.style.display = "block";
            panel.classList.remove("hologram-open"); 
            void panel.offsetWidth; 
            panel.classList.add("hologram-open");
            
            setTimeout(typeWriter, 500);
        }

        function typeWriter() {
            if (charIndex < currentMessage.length) {
                let char = currentMessage.charAt(charIndex);
                if(char === '\n') {
                    document.getElementById("terminal").innerHTML += "<br>";
                } else {
                    document.getElementById("terminal").innerHTML += char;
                }
                charIndex++;
                let typingSpeed = Math.random() * (45 - 15) + 15; 
                typingTimer = setTimeout(typeWriter, typingSpeed); 
            } else {
                document.getElementById("terminal").innerHTML += '<span class="typing-cursor"></span>';
            }
        }

        function closeTransmission() {
            clearTimeout(typingTimer);
            
            document.getElementById('message-panel').style.display = "none";
            
            document.getElementById('main-ui').style.filter = "none";
            document.getElementById('main-ui').style.pointerEvents = "auto";
            document.getElementById('main-header').style.filter = "none";
        }
    </script>
</body>
</html>
