<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmisión COG Encriptada - ¡Feliz Cumpleaños Pafe!</title>
    <style>
        /* Fondo de Pista de Hielo y Cielo de Invierno */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(to bottom, #0b1d3a 0%, #1a365d 40%, #5b8db8 70%, #a4d2e8 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            overflow: hidden;
            color: white;
        }

        /* Efecto de nieve cayendo */
        .snowflakes {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .snowflake {
            position: absolute;
            width: 8px; height: 8px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-100px) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(100vh) translateX(50px); opacity: 0.5; }
        }

        /* Título Principal */
        h1 {
            z-index: 1;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #4fc3f7, 0 0 20px #0288d1;
            margin-bottom: 40px;
            text-align: center;
            background: -webkit-linear-gradient(#fff, #90caf9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Contenedor de las tarjetas */
        .cards-container {
            display: flex;
            gap: 30px;
            z-index: 1;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Tarjetas Metálicas Estilo Gears */
        .card {
            background: linear-gradient(145deg, #2a2d34, #1b1d22);
            border: 2px solid #4a4e59;
            border-radius: 15px;
            padding: 15px;
            width: 220px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6), inset 0 0 15px rgba(0,0,0,0.8);
            position: relative;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        /* Luces de los bordes de la armadura */
        .card::before, .card::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 4px;
            border-radius: 2px;
            top: -3px;
        }
        .card.lizzie::before { left: 20px; background: #00e5ff; box-shadow: 0 0 10px #00e5ff; }
        .card.lizzie::after { right: 20px; background: #00e5ff; box-shadow: 0 0 10px #00e5ff; }
        
        .card.benjamin::before { left: 20px; background: #00e5ff; box-shadow: 0 0 10px #00e5ff; }
        .card.benjamin::after { right: 20px; background: #ff1744; box-shadow: 0 0 10px #ff1744; }

        /* Contenedor de las fotos */
        .character-img {
            width: 100%;
            height: 180px;
            background: #111;
            border-radius: 8px;
            border: 2px solid #555;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .character-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card:hover .character-img img {
            transform: scale(1.1); /* Efecto de zoom suave al pasar el mouse */
        }

        .card h2 {
            font-size: 1.2rem;
            color: #e0e0e0;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Botón de Acción */
        .action-btn {
            z-index: 1;
            background: linear-gradient(to bottom, #d32f2f, #b71c1c);
            border: 2px solid #ff5252;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 40px;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(211, 47, 47, 0.5);
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: linear-gradient(to bottom, #f44336, #d32f2f);
            box-shadow: 0 8px 25px rgba(255, 82, 82, 0.7);
            transform: scale(1.05);
        }

        /* Panel de Mensaje Oculto */
        #message-panel {
            display: none;
            z-index: 2;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 15, 20, 0.95);
            border: 2px solid #00e5ff;
            border-radius: 10px;
            padding: 40px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
            text-align: center;
        }

        .terminal-text {
            color: #00e5ff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.15rem;
            line-height: 1.6;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.5);
            text-align: left;
        }

        .typing-cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background-color: #00e5ff;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="snowflakes">
        <script>
            for(let i=0; i<40; i++){
                let snow = document.createElement('div');
                snow.className = 'snowflake';
                snow.style.left = Math.random() * 100 + 'vw';
                snow.style.animationDuration = (Math.random() * 3 + 2) + 's';
                snow.style.animationDelay = (Math.random() * 2) + 's';
                document.querySelector('.snowflakes').appendChild(snow);
            }
        </script>
    </div>

    <h1>Transmisión COG Encriptada</h1>

    <div class="cards-container" id="main-ui">
        <!-- Tarjeta Lizzie -->
        <div class="card lizzie">
            <div class="character-img">
                <img src="lizzi.jfif" alt="Lizzie Carmine">
            </div>
            <h2>Lizzie Carmine</h2>
        </div>

        <!-- Tarjeta Benjamin -->
        <div class="card benjamin">
            <div class="character-img">
                <img src="ben.jfif" alt="Benjamin Carmine">
            </div>
            <h2>Benjamin Carmine</h2>
        </div>
    </div>

    <button class="action-btn" id="decrypt-btn" onclick="startDecryption()">Descifrar Mensaje para Pafe</button>

    <div id="message-panel">
        <div class="terminal-text" id="terminal"></div>
    </div>

    <script>
        const secretMessage = "Iniciando desencriptación...\nConexión segura establecida.\n\n¡FELIZ CUMPLEAÑOS, PAFE! 🎉\n\nLizzie y Benjamin han asegurado el perímetro en la pista de hielo exclusivamente para celebrar tu día.\n\nEres una verdadera leyenda en nuestra escuadra. Que este nuevo nivel en tu vida esté lleno de victorias, recompensas épicas y cero Locust a la vista.\n\n¡Disfruta tu día al máximo, soldado! Sigue brillando.\n\nFin de la transmisión.";
        
        let i = 0;
        
        function startDecryption() {
            document.getElementById('main-ui').style.filter = "blur(5px)";
            document.getElementById('main-ui').style.opacity = "0.5";
            document.getElementById('decrypt-btn').style.display = "none";
            
            const panel = document.getElementById('message-panel');
            panel.style.display = "block";
            
            typeWriter();
        }

        function typeWriter() {
            if (i < secretMessage.length) {
                let char = secretMessage.charAt(i);
                if(char === '\n') {
                    document.getElementById("terminal").innerHTML += "<br>";
                } else {
                    document.getElementById("terminal").innerHTML += char;
                }
                i++;
                setTimeout(typeWriter, 40); 
            } else {
                document.getElementById("terminal").innerHTML += '<span class="typing-cursor"></span>';
            }
        }
    </script>
</body>
</html>
